<!DOCTYPE html>
<!--
  Memory viewer: reads one memory_viz/<function>.json, written by the
  schedule-length analysis pass (HierarchicalScheduler/MemoryViz.h).

  Four panes, each shown or hidden with the checkboxes at the top and resized
  by dragging the dividers between them:
    - Blocks: one node per region, shaded by the region's share of the
      function's total weighted gain from ideal memory work. Click one to
      open it in the other panes.
    - Original: the region's instructions in the dumped order, with the
      memory clock and the schedule clock (the cycle each issues at in the
      length analysis's raw lens), the vmcnt and lgkmcnt queues (one bar per
      op, from the row it issues to the row whose wait pops it), a chip per
      memory op labeled by type, a "+N" on each load issued N cycles after
      its inputs were ready, each wait's counter value and stall, and VGPR /
      SGPR pressure split into registers holding load results (in flight or
      back) and everything else. Virtual registers are tinted, definitions
      underlined; hover one for lines from its definitions to its reads,
      click to keep it. Lines are shown in full: the pane scrolls sideways,
      with the row number, clocks, lanes and op chips pinned at the left.
    - Edited: the same region in the order you've put it in, laid out the
      same way. Rows keep their dumped numbers in both panes; hover a row to
      see the same instruction in the other one.
    - Tiers: the memory ops of one of the two panes (switch at the top)
      grouped into tiers, that order next to the ideal. A tier is a group of
      ops no wait separates. Hover a chip to see the ops it waits on and the
      ops that wait on it.

  Trying a reorder, in the Edited pane: click a row number to select it,
  shift-click to extend the selection. The rows it can move among are
  shaded; the two rows that bound them say why on hover. Drag the selection
  by its row numbers, or alt-click (hold Alt and click) a shaded row to move
  the selection just below it. Undo, redo and reset per region.

  The model's numbers come from the compiler, never from this page. After a
  move, the Edited pane's numbers describe another order, so they fade. To
  get the new order's: "Export order" writes the function's order file
  (OrderReplay.h); add `order_file <path>` to misched.txt, recompile as that
  test usually does, and "Load replay..." the memory_viz JSON it writes. The
  Edited pane then shows the replay's numbers whenever the shown order is
  one you've replayed, including after undo and redo.
-->
<html>
<head>
<meta charset="utf-8">
<title>Memory Viewer</title>
<script src="lib/cytoscape.min.js"></script>
<script src="lib/dagre.min.js"></script>
<script src="lib/cytoscape-dagre.js"></script>
<style>
  :root {
    --ink: #0b0b0b;
    --muted: #52514e;
    --grid: #dcdbd8;
    --surface: #fcfcfb;
    --panel: #f4f3f0;
    --row: 18px;
    --vector: #2a78d6;
    --flat: #6250d6;
    --scalar: #eb6834;
    --lds: #1baf7a;
    --gds: #e87ba4;
    --barrier: #7a7874;
    --stuck: #e34948;
    --in-flight: #2a78d6;
    --arrived: #9cc0ec;
    --other: #c9c7c2;
    --highlight: #fff2b3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         font-family: sans-serif; font-size: 12px; color: var(--ink);
         background: var(--surface); }
  #top { padding: 6px 10px; border-bottom: 1px solid var(--grid);
         display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
  #meta, #status { color: var(--muted); }
  #status.problem { color: var(--stuck); font-weight: bold; }
  .toggles { display: flex; gap: 8px; }
  .toggles label { border: 1px solid var(--grid); border-radius: 4px; padding: 1px 6px;
                   cursor: pointer; user-select: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
            margin-right: 3px; vertical-align: -1px; }
  #regionbar { padding: 4px 10px; border-bottom: 1px solid var(--grid); min-height: 18px; }
  #regionbar h2 { display: inline; font-size: 13px; margin: 0 12px 0 0; }
  .stats { color: var(--muted); font-family: monospace; }
  .stats b { color: var(--ink); }
  .statline { margin-top: 2px; }
  .statline .which { display: inline-block; width: 64px; color: var(--muted); }
  .delta { font-weight: bold; }
  .delta.worse { color: var(--stuck); }
  .delta.better { color: #008300; }
  #main { flex: 1; min-height: 0; display: flex; }
  .pane { min-width: 0; overflow: auto; }
  .pane.hidden { display: none; }
  #blocks { overflow: hidden; }
  #tiers { padding: 6px 10px; }
  .splitter { flex: 0 0 6px; cursor: col-resize; background: var(--grid); }
  .splitter:hover, .splitter.drag { background: #a8a6a2; }
  body.dragging { cursor: col-resize; user-select: none; }
  .hint { color: var(--muted); }
  button { font-size: 11px; padding: 1px 8px; }

  /* Code views. Each pane starts with its title, pinned at the top. The
     columns up to the op chips stay pinned at the left when the pane
     scrolls sideways; they take the row's background, so the text scrolls
     under them. --lanes-w and --text-w are set per region. */
  .panetitle { position: sticky; top: 0; left: 0; z-index: 6; height: 20px; line-height: 20px;
               padding: 0 8px; background: var(--panel); border-bottom: 1px solid var(--grid);
               font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panetitle span { font-weight: normal; color: var(--muted); }
  .codewrap { position: relative; width: max-content; }
  .row { display: flex; height: var(--row); line-height: var(--row);
         white-space: nowrap; font-family: monospace; font-size: 11px;
         background: var(--surface); }
  .row:hover { background: #f0efec; }
  .row.waitrow { background: #f7f3ec; }
  .row.end, .row.start { color: var(--muted); font-style: italic; }
  .row.head { position: sticky; top: 20px; z-index: 4; background: var(--surface);
              font-family: sans-serif; font-size: 10px; color: var(--muted);
              border-bottom: 1px solid var(--grid); height: auto; line-height: 12px;
              padding: 2px 0; align-items: flex-end; }
  .row.flash { animation: flash 1.2s; }
  @keyframes flash { from { background: #ffd84d; } to { background: var(--surface); } }
  .num, .clock, .lanes, .tags { position: sticky; z-index: 2; background: inherit; flex: none; }
  .num { width: 34px; left: 0; text-align: right; padding-right: 6px; color: var(--muted); }
  .clock { width: 48px; text-align: right; padding-right: 6px; color: var(--muted); }
  .memclock { left: 34px; }
  .schedclock { left: 82px; }
  .lanes { width: var(--lanes-w); left: 130px; }
  .lanes.lanehost { z-index: 3; }  /* holds the lane drawing for every row */
  .lanes span { display: inline-block; }
  .tags { width: 84px; overflow: hidden; left: calc(130px + var(--lanes-w));
          box-shadow: 1px 0 0 var(--grid); }
  .text { width: var(--text-w); padding: 0 8px 0 14px; flex: none; }  /* left: the register rail */
  .text.mem { font-weight: bold; }

  /* Virtual registers: tinted by register, definitions underlined. */
  .vr { border-radius: 2px; cursor: pointer;
        background: color-mix(in srgb, var(--vr) 16%, transparent); }
  .vr.def { background: color-mix(in srgb, var(--vr) 30%, transparent);
            box-shadow: inset 0 -2px 0 var(--vr); }
  .vr.on { background: color-mix(in srgb, var(--vr) 50%, transparent);
           outline: 1.5px solid var(--vr); }
  .k0 { --vr: #2a78d6; } .k1 { --vr: #eb6834; } .k2 { --vr: #1baf7a; } .k3 { --vr: #eda100; }
  .k4 { --vr: #e87ba4; } .k5 { --vr: #008300; } .k6 { --vr: #6250d6; } .k7 { --vr: #e34948; }
  svg.reglinks { position: absolute; left: 0; top: 0; z-index: 1; pointer-events: none;
                 overflow: visible; }
  .note { width: 300px; overflow: hidden; text-overflow: ellipsis; color: var(--muted);
          padding-right: 8px; flex: none; }
  .note.stall { color: var(--ink); font-weight: bold; }
  .reg { width: 104px; display: flex; align-items: center; gap: 4px; padding-right: 6px; flex: none; }
  .bar { position: relative; width: 70px; height: 10px; background: #f1f0ed;
         border: 1px solid var(--grid); overflow: hidden; }
  .bar span { position: absolute; top: 0; height: 100%; }
  .regnum { width: 26px; text-align: right; }
  .regnum.over { color: var(--stuck); font-weight: bold; }
  svg.lanesvg { position: absolute; z-index: 1; }

  /* Chips, shared by the code and tier views */
  .chip { display: inline-block; padding: 0 4px; border-radius: 3px; color: #fff;
          font-family: monospace; font-size: 10px; line-height: 14px; margin: 1px 3px 1px 0;
          border: 1px solid transparent; cursor: default; }
  .chip.write { background: none !important; color: var(--ink); }
  .chip.hl { outline: 2px solid var(--ink); outline-offset: 1px; }
  .chip.in { outline: 2px solid #8a8884; outline-offset: 1px; }
  .chip.out { outline: 2px dashed #8a8884; outline-offset: 1px; }
  .chip .late { font-size: 9px; margin-left: 2px; opacity: 0.9; }
  .chip.stuck { box-shadow: 0 0 0 2px var(--stuck); }
  .badge { display: inline-block; padding: 0 3px; border: 1px solid var(--stuck);
           border-radius: 3px; font-size: 10px; line-height: 12px; color: var(--stuck); }

  /* Tier view */
  .tierswitch { margin-bottom: 6px; display: flex; gap: 4px; align-items: center; }
  .tierswitch button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tierintro { color: var(--muted); margin-bottom: 6px; max-width: 900px; line-height: 1.4; }
  .tiersummary { font-family: monospace; margin-bottom: 8px; }
  .tiercols { display: flex; gap: 14px; align-items: flex-start; }
  .tiercol { position: relative; flex: 1 1 0; min-width: 0; }
  .colhead { font-weight: bold; margin-bottom: 4px; }
  .tier { background: var(--panel); border-radius: 4px; padding: 3px 6px 4px; }
  .tier.empty { background: none; border: 1px dashed var(--grid); }
  .tierlabel { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .tierlabel b { color: var(--ink); }
  .boundary { font-family: monospace; font-size: 11px; color: var(--muted); margin: 3px 0 3px 10px;
              padding-left: 8px; border-left: 3px solid var(--grid); }
  .boundary.stall { border-left-color: var(--ink); color: var(--ink); }
  .endmark { font-size: 11px; color: var(--muted); margin-top: 4px; font-style: italic; }
  svg.links { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
              pointer-events: none; overflow: visible; }

  /* Reordering, in the Edited pane: the selection, the rows it can move
     among, the two rows that bound them, and the rows an alt-click can
     drop it below (a line under the row on hover). Moved rows get a bar by
     their number. */
  #edited .row:not(.head):not(.start):not(.end) .num { cursor: grab; user-select: none; }
  .row.twin, .row.twin.waitrow { background: #ece6fb; }
  .row.window, .row.window.waitrow { background: #e6f2e6; }
  .row.sel, .row.sel.waitrow { background: #cfe0f7; }
  .row.bound, .row.bound.waitrow { background: #fbe0df; }
  .row.bound .num { color: var(--stuck); font-weight: bold; }
  .codewrap.selecting .row.target:hover { box-shadow: inset 0 -2px 0 var(--vector); }
  .row.moved .num { box-shadow: inset 3px 0 0 var(--flat); color: var(--ink); }
  .codewrap.stale .clock, .codewrap.stale .badge, .codewrap.stale .note,
  .codewrap.stale .reg { opacity: 0.35; }
  #tiers.stale .tierbody { opacity: 0.35; }
  .stalenote { color: var(--ink); background: var(--highlight); padding: 3px 6px;
               border-radius: 3px; margin-bottom: 6px; }
  #editbar { margin-top: 3px; color: var(--muted); display: flex; gap: 8px; align-items: center;
             flex-wrap: wrap; }
  #editbar b { color: var(--ink); }
  .dropline { position: absolute; left: 0; width: 100%; height: 0; z-index: 5; pointer-events: none;
              border-top: 2px solid var(--vector); }
  .dropline.blocked { border-top-color: var(--stuck); }
  .dropline span { position: absolute; top: -9px; padding: 0 4px; border-radius: 3px;
                   font-family: sans-serif; font-size: 10px; line-height: 15px; white-space: nowrap;
                   background: var(--surface); border: 1px solid var(--vector); color: var(--vector); }
  .dropline.blocked span { border-color: var(--stuck); color: var(--stuck); }
  body.rowdrag, body.rowdrag * { cursor: grabbing !important; user-select: none; }

  /* Hover marks go over everything else. */
  .row.hl, .row.hl.waitrow { background: var(--highlight); }
  .row.blame, .row.blame.waitrow { background: #fbe0df; }
</style>
</head>
<body>
<div id="top">
  <label><b>Load...</b> <input type="file" id="file" accept=".json"></label>
  <label title="A memory_viz JSON from compiling an exported order (order_file in misched.txt)">
    <b>Load replay...</b> <input type="file" id="replayfile" accept=".json" disabled></label>
  <button id="export" disabled title="Download this function's order file, with every region in its edited order">Export order</button>
  <span class="toggles">
    <label><input type="checkbox" data-pane="blocks" checked> Blocks</label>
    <label><input type="checkbox" data-pane="code" checked> Original</label>
    <label><input type="checkbox" data-pane="edited" checked> Edited</label>
    <label><input type="checkbox" data-pane="tiers" checked> Tiers</label>
  </span>
  <span class="legend">
    <span class="chip" style="background:var(--vector)">V</span>vector
    <span class="chip" style="background:var(--flat)">F</span>flat
    <span class="chip" style="background:var(--scalar)">S</span>scalar
    <span class="chip" style="background:var(--lds)">LDS</span>
    <span class="chip" style="background:var(--gds)">GDS</span>
    <span class="chip" style="background:var(--barrier)">BAR</span>barrier
    <span class="chip write" style="border-color:var(--vector)">V1w</span>write
  </span>
  <span id="meta" class="hint">No file loaded.</span>
  <span id="status"></span>
</div>
<div id="regionbar"></div>
<div id="main">
  <div id="blocks" class="pane"></div>
  <div id="code" class="pane"><div class="hint" style="padding:8px">Load a memory_viz/&lt;function&gt;.json file.</div></div>
  <div id="edited" class="pane"></div>
  <div id="tiers" class="pane"></div>
</div>

<script>
"use strict";
cytoscape.use(window.cytoscapeDagre);

const ROW = 18;  // px per row; keep in sync with --row
const TYPE_COLOR = { vector: "#2a78d6", flat: "#6250d6", scalar: "#eb6834",
                     lds: "#1baf7a", gds: "#e87ba4", barrier: "#7a7874" };
let DATA = null;
let cy = null;
let REGION = null;     // the selected region, as dumped
let BLOCK = null;      // its block

document.getElementById("file").addEventListener("change", (event) => {
  const file = event.target.files[0];
  if (!file) return;
  file.text().then((text) => {
    DATA = JSON.parse(text);
    buildGraph();
  });
});

document.getElementById("replayfile").addEventListener("change", (event) => {
  const file = event.target.files[0];
  if (!file || !DATA) return;
  file.text().then((text) => {
    loadReplay(JSON.parse(text), file.name);
    event.target.value = "";  // so the same file can be loaded again
  });
});

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function blockName(block) {
  return block.name && block.name.length ? block.name : "bb." + block.number;
}

// One hue, light to dark, by share. The square root spreads out the small
// shares, which would otherwise all look the same.
function shareColor(share) {
  if (share <= 0) return "#f1f0ed";
  const lightness = 90 - 52 * Math.sqrt(Math.min(share, 1));
  return `hsl(4, 72%, ${lightness}%)`;
}

function setStatus(text, problem) {
  const status = document.getElementById("status");
  status.textContent = text;
  status.classList.toggle("problem", !!problem);
}

// --- Panes ------------------------------------------------------------------

// Every shown pane but the last has a width in px, set by dragging the
// divider to its right; the last shown pane takes the rest.
const PANES = ["blocks", "code", "edited", "tiers"];
const paneWidths = { blocks: Math.round(0.12 * window.innerWidth),
                     code: Math.round(0.3 * window.innerWidth),
                     edited: Math.round(0.3 * window.innerWidth),
                     tiers: Math.round(0.28 * window.innerWidth) };

function savePanes(shown) {
  try {
    localStorage.setItem("memory_viewer_panes", JSON.stringify({ shown, widths: paneWidths }));
  } catch (e) {}
}

function applyPanes() {
  const shown = {};
  for (const box of document.querySelectorAll(".toggles input")) shown[box.dataset.pane] = box.checked;
  for (const splitter of document.querySelectorAll(".splitter")) splitter.remove();
  const visible = PANES.filter((name) => shown[name]);
  for (const name of PANES) {
    const pane = document.getElementById(name);
    pane.classList.toggle("hidden", !shown[name]);
    const index = visible.indexOf(name);
    if (index < 0) continue;
    if (index === visible.length - 1) {
      pane.style.flex = "1 1 0";
      continue;
    }
    pane.style.flex = `0 0 ${paneWidths[name]}px`;
    const splitter = document.createElement("div");
    splitter.className = "splitter";
    splitter.addEventListener("mousedown", (event) => startDrag(event, name, splitter, shown));
    pane.after(splitter);
  }
  savePanes(shown);
  if (cy && shown.blocks) { cy.resize(); cy.fit(undefined, 20); }
}

function startDrag(event, name, splitter, shown) {
  event.preventDefault();
  const pane = document.getElementById(name);
  const startX = event.clientX;
  const startWidth = pane.getBoundingClientRect().width;
  splitter.classList.add("drag");
  document.body.classList.add("dragging");
  const move = (e) => {
    paneWidths[name] = Math.max(120, Math.round(startWidth + e.clientX - startX));
    pane.style.flex = `0 0 ${paneWidths[name]}px`;
  };
  const up = () => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    splitter.classList.remove("drag");
    document.body.classList.remove("dragging");
    savePanes(shown);
    if (cy && name === "blocks") cy.resize();
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
}

try {
  const saved = JSON.parse(localStorage.getItem("memory_viewer_panes") || "null");
  if (saved && saved.shown) {
    for (const box of document.querySelectorAll(".toggles input")) {
      if (box.dataset.pane in saved.shown) box.checked = saved.shown[box.dataset.pane];
    }
    Object.assign(paneWidths, saved.widths || {});
  }
} catch (e) {}
for (const box of document.querySelectorAll(".toggles input")) {
  box.addEventListener("change", applyPanes);
}
applyPanes();

// --- Block graph -------------------------------------------------------

// One node per region, chained within its block; one node for a block with
// no region. Control-flow edges run from a block's last node to each
// successor's first.
function buildGraph() {
  EDITS.clear();
  REPLAYS.clear();
  SELECTION = null;
  setStatus("");
  document.getElementById("export").disabled = false;
  document.getElementById("replayfile").disabled = false;
  const elements = [];
  const firstNode = {}, lastNode = {};
  let best = null;
  for (const block of DATA.blocks) {
    if (!block.regions.length) {
      const id = "b" + block.number;
      firstNode[block.number] = lastNode[block.number] = id;
      elements.push({ data: { id, label: blockName(block) + "\n(no region)",
                              color: "#e6e5e2", text: "#52514e" } });
      continue;
    }
    let previous = null;
    for (const region of block.regions) {
      const id = "r" + region.index;
      const label = blockName(block) + "  r" + region.index +
        "\nshare " + (100 * region.share).toFixed(1) + "% · f " +
        block.frequency.toPrecision(3) + "\ngain " + region.gain + " cyc";
      elements.push({ data: { id, label, color: shareColor(region.share),
                              text: region.share > 0.35 ? "#fff" : "#0b0b0b",
                              block: block.number, region: region.index } });
      if (previous) {
        elements.push({ data: { id: previous + "_" + id, source: previous, target: id },
                        classes: "inblock" });
      } else {
        firstNode[block.number] = id;
      }
      previous = id;
      if (!best || region.share > best.region.share) best = { block, region };
    }
    lastNode[block.number] = previous;
  }
  for (const block of DATA.blocks) {
    for (const successor of block.succs) {
      elements.push({ data: { id: "e" + block.number + "_" + successor,
                              source: lastNode[block.number],
                              target: firstNode[successor] } });
    }
  }

  if (cy) cy.destroy();
  cy = cytoscape({
    container: document.getElementById("blocks"),
    elements,
    style: [
      { selector: "node", style: {
          "background-color": "data(color)", "label": "data(label)", "color": "data(text)",
          "text-wrap": "wrap", "text-valign": "center", "text-halign": "center",
          "font-size": 9, "font-family": "monospace", "width": 130, "height": 44,
          "shape": "round-rectangle", "border-width": 1, "border-color": "#a8a6a2" } },
      { selector: "node.sel", style: { "border-width": 3, "border-color": "#0b0b0b" } },
      { selector: "node.edited", style: { "border-style": "dashed", "border-width": 3,
                                          "border-color": "#6250d6" } },
      { selector: "edge", style: {
          "width": 1.5, "line-color": "#c4c2be", "target-arrow-color": "#c4c2be",
          "target-arrow-shape": "triangle", "curve-style": "bezier" } },
      { selector: "edge.inblock", style: {
          "width": 4, "line-color": "#8a8884", "target-arrow-shape": "none" } },
    ],
    layout: { name: "dagre", rankDir: "TB", nodeSep: 16, rankSep: 26 },
    // Without a cap, fitting a function with one or two regions blows the
    // nodes up to fill the pane.
    maxZoom: 1.3,
    wheelSensitivity: 0.2,
  });
  cy.on("tap", "node", (event) => {
    const data = event.target.data();
    if (data.region === undefined) return;
    selectRegion(data.block, data.region);
  });

  const meta = document.getElementById("meta");
  meta.classList.remove("hint");
  meta.innerHTML = "<b>" + esc(DATA.function) + "</b> — " + esc(DATA.scheduler) +
    " — occupancy " + DATA.occupancy + " (VGPR budget " + DATA.vgpr_budget +
    ", SGPR " + DATA.sgpr_budget + ") — total weighted gain " +
    DATA.total_weighted_gain.toFixed(1) + " cyc";

  // Open on the region with the biggest share.
  if (best) selectRegion(best.block.number, best.region.index);
}

function selectRegion(blockNumber, regionIndex) {
  cy.nodes().removeClass("sel");
  cy.getElementById("r" + regionIndex).addClass("sel");
  const block = DATA.blocks.find((b) => b.number === blockNumber);
  REGION = block.regions.find((r) => r.index === regionIndex);
  BLOCK = block;
  SUCCESSORS = REGION.rows.map(() => []);
  REGION.rows.forEach((row, i) => {
    for (const predecessor of row.predecessors || []) {
      SUCCESSORS[predecessor.row].push({ row: i, kind: predecessor.kind });
    }
  });
  analyzeRegisters(REGION);
  SELECTION = null;
  rerender(true);
}

// --- Views -------------------------------------------------------------

// What a code pane shows. `region` is the region whose numbers it shows:
// the dump's, or a replay's. `order` is the order to show that region's
// rows in, as indices into region.rows, and `labels` gives each of those
// rows' number in the dump, which is the number shown. `stale` says the
// numbers describe a different order than the one shown. `data` is the
// function-wide data the region came with (register budgets).
let VIEWS = { code: null, edited: null };
let TIERS_SIDE = "code";  // which pane the tier view shows

function withConsumers(view) {
  view.consumers = view.region.ops.map(() => []);
  view.region.ops.forEach((op, i) => op.inputs.forEach((j) => view.consumers[j].push(i)));
  return view;
}

function originalView() {
  const identity = REGION.rows.map((_, i) => i);
  return withConsumers({ side: "code", pane: document.getElementById("code"), region: REGION,
                         data: DATA, order: identity, labels: identity, stale: false,
                         replay: null });
}

// The edited order's view. A replay of exactly this order gives its own
// numbers, and the dumped order has the dump's. Otherwise the numbers are
// the latest replay's, or the dump's without one, shown faded.
function editedView() {
  const edit = editOf(REGION);
  const replays = REPLAYS.get(REGION.index);
  const exact = replays ? replays.byOrder.get(edit.order.join(",")) : null;
  const latest = replays && isEdited(REGION) ? replays.latest : null;
  const basis = exact || latest;
  const region = basis ? basis.region : REGION;
  const labels = basis ? basis.labels : REGION.rows.map((_, i) => i);
  const order = edit.order.map((row) => (basis ? basis.rowOfLabel[row] : row));
  return withConsumers({ side: "edited", pane: document.getElementById("edited"), region,
                         data: basis ? basis.data : DATA, order, labels,
                         stale: order.some((row, p) => row !== p), replay: exact });
}

const tiersView = () => VIEWS[TIERS_SIDE];

// A row of the view's region, named by its number in the dump; the region's
// row count stands for the region end.
function rowName(view, row) {
  return row === view.region.rows.length ? "the region end" : "row " + view.labels[row];
}

// The row element showing dump row `row` (-1: the region start; the row
// count: the region end) in `pane`.
function rowIn(pane, row) {
  return pane.querySelector(`.row[data-row="${row}"]`);
}

// Redraws everything that depends on the selected region and its edited
// order. Keeps each pane's scroll position unless `resetScroll`, and keeps
// the pinned register.
function rerender(resetScroll) {
  const scrolls = {};
  for (const id of ["code", "edited", "tiers"]) {
    const pane = document.getElementById(id);
    scrolls[id] = [pane.scrollTop, pane.scrollLeft];
  }
  const pinned = pinnedReg;

  VIEWS = { code: originalView(), edited: editedView() };
  renderRegionBar();
  renderCode(VIEWS.code);
  renderCode(VIEWS.edited);
  renderTiers();

  for (const id of ["code", "edited", "tiers"]) {
    const pane = document.getElementById(id);
    [pane.scrollTop, pane.scrollLeft] = resetScroll ? [0, 0] : scrolls[id];
  }
  shownReg = null;
  pinnedReg = resetScroll ? null : pinned;
  if (pinnedReg !== null) showRegister(pinnedReg);
  cy.getElementById("r" + REGION.index).toggleClass("edited", isEdited(REGION));
  paintSelection();
}

// --- Shared helpers ----------------------------------------------------

const isMemOp = (op) => op.type !== "barrier";
const isSinkWait = (region, wait) => wait.row === region.rows.length;

function chip(op, index, extraClass, extraText) {
  const color = TYPE_COLOR[op.type];
  const write = isMemOp(op) && !op.read;
  return `<span class="chip${write ? " write" : ""}${extraClass || ""}" data-op="${index}" ` +
         `style="background:${color};border-color:${color}">${esc(op.label)}${extraText || ""}</span>`;
}

function opTitle(view, op) {
  if (!isMemOp(op)) {
    return `${op.label}: s_barrier at ${rowName(view, op.row)}, waits for every memory op before it`;
  }
  let t = `${op.label}: ${op.type} ${op.read ? "read" : "write"}${op.def ? " of " + op.def : ""}` +
          ` at ${rowName(view, op.row)}, latency ${op.latency}\n` +
          `issued at clock ${op.issue_time}, data back at ${op.data_time}\n` +
          `tier ${op.tier} here, tier ${op.ideal_tier} in the ideal (earliest start ${op.ideal_start})`;
  if (op.inputs.length) {
    t += "\nwaits on " + op.inputs.map((j) => view.region.ops[j].label).join(", ");
  }
  return t;
}

function listLabels(region, indices, max) {
  const labels = indices.map((i) => region.ops[i].label);
  return labels.length <= max ? labels.join(", ")
                              : labels.slice(0, max).join(", ") + `, … (${labels.length})`;
}

// A queue's counter value after a wait: the ops issued into it before the
// wait's row that it doesn't pop, which is what an s_waitcnt for it allows
// to stay outstanding.
function counterAfter(region, wait, queue) {
  let outstanding = 0;
  for (const op of region.ops) {
    if (op[queue] && op.row < wait.row && Math.max(...op.pop_rows, -1) > wait.row) {
      outstanding++;
    }
  }
  return outstanding;
}

function waitNote(region, wait) {
  const ops = region.ops;
  const counters = [];
  for (const queue of ["vmcnt", "lgkmcnt"]) {
    if (wait.popped.some((i) => ops[i][queue])) {
      counters.push(queue + "(" + counterAfter(region, wait, queue) + ")");
    }
  }
  // The stall first: it's what matters most and the note gets cut off.
  const stall = wait.end_time - wait.begin_time;
  let note = (stall > 0 ? "stall " + stall + " · " : "no stall · ") + counters.join(" ");
  if (wait.barrier) {
    note += " drain (barrier)";
  } else if (wait.drain) {
    note += " drain (" + (wait.cautious ? "FLAT cautious mode" : "scalar or mixed lgkmcnt") + ")";
  }
  if (isSinkWait(region, wait)) {
    note += " for everything still in flight";
  } else if (wait.waited_for.length) {
    const names = wait.waited_for.map((i) => (ops[i].def || "?") + " " + ops[i].label);
    note += " for " + names.join(", ");
  }
  return { note, stall };
}

// Per wait: the loads it delayed past their inputs, from each load's
// stuck_waits.
function loadsDelayedBy(region) {
  const delayed = region.waits.map(() => []);
  region.ops.forEach((op, i) => {
    for (const sw of op.stuck_waits) if (sw.wait >= 0) delayed[sw.wait].push(i);
  });
  return delayed;
}

function statsHtml(block, region) {
  const memOps = region.ops.filter(isMemOp);
  const stuck = memOps.filter((op) => op.stuck > 0).length;
  return `memory time <b>${region.scheduled_memory_time}</b> vs ideal <b>${region.ideal_memory_time}</b> · ` +
         `length <b>${region.schedule_length}</b> (floor ${region.schedule_length_floor}) · ` +
         `gain <b>${region.gain}</b> cyc · ${memOps.length} memory ops, <b>${stuck}</b> loads issued late`;
}

// The change from the dump to a replay, for one number where lower is
// better.
function deltaHtml(before, after) {
  if (after === before) return "";
  const sign = after > before ? "+" : "";
  return ` <span class="delta ${after > before ? "worse" : "better"}">(${sign}${after - before})</span>`;
}

function renderRegionBar() {
  const region = REGION;
  const edited = VIEWS.edited;
  let h = `<h2>${esc(blockName(BLOCK))} — region ${region.index} — ${region.rows.length} instructions</h2>` +
          `<span class="stats">frequency <b>${BLOCK.frequency.toPrecision(3)}</b> · ` +
          `share <b>${(100 * region.share).toFixed(1)}%</b></span>` +
          `<div class="statline stats"><span class="which">original</span>${statsHtml(BLOCK, region)}</div>`;
  if (edited.replay) {
    const r = edited.region;
    h += `<div class="statline stats"><span class="which">edited</span>` +
         `memory time <b>${r.scheduled_memory_time}</b>${deltaHtml(region.scheduled_memory_time, r.scheduled_memory_time)}` +
         ` vs ideal <b>${r.ideal_memory_time}</b> · length <b>${r.schedule_length}</b>` +
         `${deltaHtml(region.schedule_length, r.schedule_length)} (floor ${r.schedule_length_floor}) · ` +
         `gain <b>${r.gain}</b> cyc · <b>${r.ops.filter((op) => isMemOp(op) && op.stuck > 0).length}</b> ` +
         `loads issued late · occupancy <b>${edited.data.occupancy}</b>` +
         `${edited.data.occupancy !== DATA.occupancy ? " (was " + DATA.occupancy + ")" : ""} ` +
         `<span class="hint">(replayed)</span></div>`;
  } else if (isEdited(region)) {
    h += `<div class="statline stats"><span class="which">edited</span>` +
         `<span class="hint">not replayed: export the order, compile with it, and load the replay</span></div>`;
  }
  h += `<div id="editbar"></div>`;
  document.getElementById("regionbar").innerHTML = h;
  renderEditBar();
}

// --- Code views ----------------------------------------------------------

// Pack [start, end] row intervals into side-by-side tracks so overlapping
// ones don't sit on top of each other. Returns the track count.
function packTracks(items) {
  const trackEnd = [];
  const sorted = items.slice().sort((a, b) => a.start - b.start);
  for (const item of sorted) {
    let track = 0;
    while (track < trackEnd.length && item.start <= trackEnd[track]) track++;
    item.track = track;
    trackEnd[track] = item.end;
  }
  return trackEnd.length;
}

const rowCenter = (row) => row * ROW + ROW / 2;

// One queue's lane: a bar per op in the queue, from its issue row to the row
// whose wait pops it from this queue. Bars get thinner as more ops are in
// flight at once, so the lane stays under ~150px.
function laneLayout(region, queue, totalRows) {
  const items = [];
  region.ops.forEach((op, index) => {
    if (!op[queue]) return;
    // An op in both queues is popped once per queue; use the later pop.
    const popRow = op.pop_rows.length ? Math.max(...op.pop_rows) : totalRows - 1;
    items.push({ op, index, start: op.row, end: popRow });
  });
  const tracks = packTracks(items);
  let bar = 1, gap = 1;
  for (const [b, g] of [[5, 2], [3, 1], [2, 1]]) {
    if (tracks * (b + g) <= 150) { bar = b; gap = g; break; }
  }
  const width = Math.max(tracks * (bar + gap) + 4, 48);
  return { items, bar, gap, width };
}

// The lane drawing. Bars are placed by row position, so it's only drawn
// when the view shows its region's rows in their own order.
function laneSvgBody(view, lane, xOffset, queue, totalRows) {
  let svg = "";
  for (const item of lane.items) {
    const x = xOffset + 2 + item.track * (lane.bar + lane.gap);
    const y = rowCenter(item.start);
    const height = Math.max(rowCenter(item.end) - y, 2);
    const color = TYPE_COLOR[item.op.type];
    const fill = item.op.read ? color : "none";
    const popped = item.end >= totalRows - 1 ? "the region end" : "the wait at " + rowName(view, item.end);
    svg += `<rect x="${x}" y="${y}" width="${lane.bar}" height="${height}" fill="${fill}" ` +
           `stroke="${color}" stroke-width="1" data-op="${item.index}"><title>${esc(item.op.label)} in ${queue}: ` +
           `issued at ${rowName(view, item.start)} (clock ${item.op.issue_time}), popped by ${popped}; ` +
           `data back at clock ${item.op.data_time}</title></rect>` +
           `<line x1="${x - 1}" x2="${x + lane.bar + 1}" y1="${y + height}" y2="${y + height}" ` +
           `stroke="${color}" stroke-width="2"/>`;
  }
  return svg;
}

// A stacked bar: registers holding a load result whose load is in flight,
// holding one that's back, and everything else, against the budget.
function pressureCell(total, load, inFlight, budget, kind) {
  const scale = (x) => (100 * Math.max(x, 0) / Math.max(budget, 1)).toFixed(1) + "%";
  const back = load - inFlight;
  const other = Math.max(total - load, 0);
  const title = `${kind} ${total} of ${budget}:\n${inFlight} hold a load result still in flight\n` +
                `${back} hold a load result that's back\n${other} other`;
  return `<div class="reg" title="${title}"><div class="bar">` +
         `<span style="left:0;width:${scale(inFlight)};background:var(--in-flight)"></span>` +
         `<span style="left:${scale(inFlight)};width:${scale(back)};background:var(--arrived)"></span>` +
         `<span style="left:${scale(load)};width:${scale(other)};background:var(--other)"></span>` +
         `</div><span class="regnum${total > budget ? " over" : ""}">${total}</span></div>`;
}

function paneTitle(view) {
  if (view.side === "code") {
    return `Original <span>— as dumped</span>`;
  }
  const moved = editOf(REGION).moved.size;
  if (view.replay) {
    return `Edited <span>— replayed: these are the compiler's numbers for this order</span>`;
  }
  if (!isEdited(REGION)) {
    return `Edited <span>— the dumped order</span>`;
  }
  const from = REPLAYS.has(REGION.index) ? "the last replay's" : "the dump's";
  return `Edited <span>— ${moved} row${moved === 1 ? "" : "s"} moved; faded numbers are ` +
         `${from}, for another order</span>`;
}

function renderCode(view) {
  const pane = view.pane;
  const region = view.region;
  const rows = region.rows;
  const totalRows = rows.length + 1;  // plus the region-end row
  const delayed = loadsDelayedBy(region);
  const moved = view.side === "edited" ? editOf(REGION).moved : new Set();

  const vm = laneLayout(region, "vmcnt", totalRows);
  const lgkm = laneLayout(region, "lgkmcnt", totalRows);
  const lanesWidth = vm.width + lgkm.width;
  const lanesCell = `<div class="lanes"></div>`;
  // The lanes, drawn in the first row's lane cell, over every row's. Left
  // out of a faded view, whose rows aren't where the bars would point.
  const lanesSvg = view.stale ? "" :
    `<svg class="lanesvg" style="left:0;top:0" width="${lanesWidth}" height="${totalRows * ROW}">` +
    laneSvgBody(view, vm, 0, "vmcnt", totalRows) + laneSvgBody(view, lgkm, vm.width, "lgkmcnt", totalRows) +
    `</svg>`;

  // The instruction column fits the longest line, plus its padding.
  const longest = Math.max(16, ...rows.map((row) => row.text.length));
  let h = `<div class="panetitle">${paneTitle(view)}</div>` +
          `<div class="codewrap${view.stale ? " stale" : ""}" ` +
          `style="--lanes-w:${lanesWidth}px;--text-w:calc(${longest}ch + 24px)">`;
  h += `<div class="row head"><div class="num">row</div>` +
       `<div class="clock memclock" title="The memory model's clock when the instruction issues: it only moves at a wait that stalls">mem<br>clock</div>` +
       `<div class="clock schedclock" title="The cycle the instruction issues at in the whole schedule time (the length analysis's raw lens)">sched<br>clock</div>` +
       `<div class="lanes"><span style="width:${vm.width}px" ` +
       `title="One bar per op in vmcnt, from where it issues to the wait that pops it">vmcnt</span>` +
       `<span style="width:${lgkm.width}px" title="One bar per op in lgkmcnt">lgkmcnt</span></div>` +
       `<div class="tags" title="+N: a load issued N cycles after its inputs were ready">op</div>` +
       `<div class="text" title="Each virtual register is tinted, its definitions underlined. Hover one for lines ` +
       `from its definitions to its reads; click to keep it.">instruction</div><div class="note">wait</div>` +
       `<div class="reg" title="VGPRs in use after the instruction; dark blue: holding a load result still in flight; ` +
       `light blue: holding a load result that's back; grey: other">VGPR (of ${view.data.vgpr_budget})</div>` +
       `<div class="reg" title="SGPRs in use, split the same way">SGPR (of ${view.data.sgpr_budget})</div></div>`;

  // The region start: in the Edited pane, alt-click it to move the
  // selection to the top.
  h += `<div class="row start" data-row="-1"><div class="num"></div><div class="clock memclock"></div>` +
       `<div class="clock schedclock"></div>${lanesCell}<div class="tags"></div>` +
       `<div class="text">— region start —</div></div>`;

  for (let position = 0; position < view.order.length; position++) {
    const i = view.order[position];
    const row = rows[i];
    const label = view.labels[i];
    const op = row.op >= 0 ? region.ops[row.op] : null;
    const wait = row.wait >= 0 ? region.waits[row.wait] : null;

    let tags = "";
    if (op) {
      tags += chip(op, row.op);
      if (op.stuck > 0) {
        const parts = op.stuck_waits.map((sw) => `${rowName(view, region.waits[sw.wait].row)} (${sw.cycles} cyc)`);
        const title = `Issued at clock ${op.issue_time}, but its inputs were ready at clock ` +
                      `${op.inputs_ready_time}: ${op.stuck} cycles late.\n` +
                      `Waits that moved the clock past its inputs: ${parts.join(", ")}`;
        tags += `<span class="badge" data-stuck="${row.op}" title="${esc(title)}">+${op.stuck}</span>`;
      }
    }

    let note = "", noteClass = "note", noteTitle = "", noteData = "";
    if (wait) {
      const w = waitNote(region, wait);
      note = w.note;
      noteTitle = note;
      if (w.stall > 0) noteClass += " stall";
      if (delayed[row.wait].length) {
        noteTitle += `\nLoads issued after this wait that didn't need it: ` +
                     listLabels(region, delayed[row.wait], 16);
        noteData = ` data-wait="${row.wait}"`;
      }
    }

    h += `<div class="row${wait ? " waitrow" : ""}${moved.has(label) ? " moved" : ""}" data-row="${label}">` +
      `<div class="num">${label}</div><div class="clock memclock">${row.memory_time}</div>` +
      `<div class="clock schedclock">${row.schedule_cycle}</div>` +
      (position === 0 ? `<div class="lanes lanehost">${lanesSvg}</div>` : lanesCell) +
      `<div class="tags">${tags}</div>` +
      `<div class="text${op ? " mem" : ""}">${textHtml(row)}</div>` +
      `<div class="${noteClass}" title="${esc(noteTitle)}"${noteData}>${esc(note)}</div>` +
      pressureCell(row.vgpr, row.vgpr_load, row.vgpr_load_in_flight, view.data.vgpr_budget, "VGPR") +
      pressureCell(row.sgpr, row.sgpr_load, row.sgpr_load_in_flight, view.data.sgpr_budget, "SGPR") +
      `</div>`;
  }

  // The region end: where the sink pops whatever is still in flight.
  const sinkIndex = region.waits.findIndex((w) => isSinkWait(region, w));
  const sink = sinkIndex >= 0 ? region.waits[sinkIndex] : null;
  const sinkNote = sink ? waitNote(region, sink).note : "";
  h += `<div class="row end" data-row="${rows.length}">` +
    `<div class="num">${rows.length}</div>` +
    `<div class="clock memclock">${sink ? sink.end_time : region.scheduled_memory_time}</div>` +
    `<div class="clock schedclock" title="The exit issues at cycle ${region.schedule_length - 1}; the length is ` +
    `${region.schedule_length}">${region.schedule_length - 1}</div>${lanesCell}` +
    `<div class="tags"></div><div class="text">— region end —</div>` +
    `<div class="note" title="${esc(sinkNote)}">${esc(sinkNote)}</div></div>`;

  // The register lines, sized to the whole code view once it's laid out.
  h += `<svg class="reglinks"></svg></div>`;
  pane.innerHTML = h;
  const wrap = pane.querySelector(".codewrap");
  const regLinks = wrap.querySelector("svg.reglinks");
  regLinks.setAttribute("width", wrap.scrollWidth);
  regLinks.setAttribute("height", wrap.scrollHeight);
}

// --- Registers -----------------------------------------------------------

// Per virtual register of the selected region: its tint (k0-k7), the dump
// rows that define it, and its reads, each with the row of the def it reads
// (-1 when the value comes from before the region). Rows keep their dump
// numbers in both code panes, so one table serves both.
let REGS = new Map();
let shownReg = null;   // the register whose lines are drawn
let pinnedReg = null;  // the clicked one, shown when the cursor is on no other

// Eight tints for hundreds of registers. A register takes the tint that has
// gone unseen for the most rows when it first appears in the dumped order,
// so registers mentioned near each other differ; hovering is what matches
// far-apart ones.
const REG_TINTS = 8;

function regInfo(reg) {
  if (!REGS.has(reg)) REGS.set(reg, { tint: -1, defs: [], reads: [] });
  return REGS.get(reg);
}

function analyzeRegisters(region) {
  REGS = new Map();
  shownReg = null;
  pinnedReg = null;
  const tintLastSeen = new Array(REG_TINTS).fill(-Infinity);
  const latestDef = new Map();
  region.rows.forEach((row, i) => {
    // Reads before defs: a row that writes part of a register it also reads
    // reads the earlier def.
    for (const reg of row.uses) {
      regInfo(reg).reads.push({ row: i, from: latestDef.has(reg) ? latestDef.get(reg) : -1 });
    }
    for (const reg of row.defs) {
      regInfo(reg).defs.push(i);
      latestDef.set(reg, i);
    }
    for (const m of row.text.matchAll(/%(\d+)/g)) {
      const info = regInfo(+m[1]);
      if (info.tint < 0) info.tint = tintLastSeen.indexOf(Math.min(...tintLastSeen));
      tintLastSeen[info.tint] = i;
    }
  });
}

// A row's text as HTML, each virtual register (%85, %85.sub0) in a span
// tinted by register. A mention before " = " is a def if the row defines the
// register; after it, a read, unless the row only defines it (an implicit-def
// or an inline asm output, printed after the opcode).
function textHtml(row) {
  const equals = row.text.indexOf(" = ");
  let html = "", at = 0;
  for (const m of row.text.matchAll(/%(\d+)(\.[A-Za-z0-9_]+)?/g)) {
    const reg = +m[1];
    const beforeEquals = equals >= 0 && m.index < equals;
    const def = row.defs.includes(reg) && (beforeEquals || !row.uses.includes(reg));
    html += esc(row.text.slice(at, m.index)) +
            `<span class="vr k${regInfo(reg).tint}${def ? " def" : ""}" data-reg="${reg}">${esc(m[0])}</span>`;
    at = m.index + m[0].length;
  }
  return html + esc(row.text.slice(at));
}

function rowList(rows) {
  const unique = [...new Set(rows)];
  return unique.length <= 12 ? unique.join(", ")
                             : unique.slice(0, 12).join(", ") + `, … (${unique.length})`;
}

function regTitle(reg) {
  const info = REGS.get(reg);
  let t = `%${reg}: ` + (info.defs.length ? "defined at row " + rowList(info.defs)
                                           : "defined before the region");
  if (info.defs.length && info.reads.some((read) => read.from < 0)) t += " and before the region";
  t += info.reads.length ? "; read at row " + rowList(info.reads.map((read) => read.row))
                         : "; not read in this region";
  if (REGION.live_out.includes(reg)) t += "; read after the region";
  return t + "\nClick to keep it highlighted; Esc to let go.";
}

const codePanes = () => [VIEWS.code, VIEWS.edited].filter((view) => view);

// Highlights `reg`'s mentions and draws its lines, in both code panes. null
// clears.
function showRegister(reg) {
  if (reg === shownReg) return;
  for (const el of document.querySelectorAll(".vr.on")) el.classList.remove("on");
  shownReg = reg;
  for (const view of codePanes()) {
    if (reg !== null) {
      for (const el of view.pane.querySelectorAll(`.vr[data-reg="${reg}"]`)) el.classList.add("on");
    }
    drawRegister(view);
  }
}

// The shown register's lines in one code pane. They run along a rail just
// right of the pinned columns, and from it to each mention along the row's
// edge, so they don't cross the text: a dot under each def, an arrowhead
// over each read. A value from before the region starts the rail at the
// first row; one read after the region runs it to the region end. Redrawn
// when the pane scrolls sideways, since the rail stays by the pinned
// columns.
function drawRegister(view) {
  const pane = view.pane;
  const wrap = pane.querySelector(".codewrap");
  const svg = wrap && wrap.querySelector("svg.reglinks");
  if (!svg) return;
  svg.innerHTML = "";
  if (shownReg === null || !REGS.has(shownReg)) return;
  const reg = shownReg;
  const info = REGS.get(reg);
  const mention = pane.querySelector(`.vr[data-reg="${reg}"]`);
  if (!mention) return;
  const color = getComputedStyle(mention).getPropertyValue("--vr").trim();

  const base = wrap.getBoundingClientRect();
  const firstRow = view.labels[view.order[0]];
  const railX = rowIn(pane, firstRow).querySelector(".tags").getBoundingClientRect().right - base.left + 6;
  const rowTop = (row) => rowIn(pane, row).getBoundingClientRect().top - base.top;
  const tokenX = (row, def) => {
    const rowElement = rowIn(pane, row);
    const el = rowElement.querySelector(`.vr[data-reg="${reg}"]${def ? ".def" : ":not(.def)"}`) ||
               rowElement.querySelector(`.vr[data-reg="${reg}"]`);
    if (!el) return null;
    const box = el.getBoundingClientRect();
    return box.left + box.width / 2 - base.left;
  };
  const stroke = `fill="none" stroke="${color}" stroke-width="1.5"`;
  // A label for the rail's start or end, past the end of the row's text and
  // joined to the rail by a dotted line along the row's top edge.
  const label = (row, text) => {
    const range = document.createRange();
    range.selectNodeContents(rowIn(pane, row).querySelector(".text"));
    const x = range.getBoundingClientRect().right - base.left + 10;
    const y = rowTop(row);
    return `<path d="M${railX},${y + 1} H${x - 3}" ${stroke} stroke-dasharray="2,3"/>` +
           `<text x="${x}" y="${y + 13}" font-size="10" font-family="sans-serif" fill="${color}">${text}</text>`;
  };

  let paths = "", top = Infinity, bottom = -Infinity;
  const reach = (y) => { top = Math.min(top, y); bottom = Math.max(bottom, y); };

  // Defs: along the bottom edge of the row.
  for (const d of info.defs) {
    const x = tokenX(d, true);
    if (x === null) continue;
    const y = rowTop(d) + ROW;
    paths += `<path d="M${railX},${y} H${x}" ${stroke}/><circle cx="${x}" cy="${y - 1}" r="2.5" fill="${color}"/>`;
    reach(y);
  }

  // Reads: along the top edge of the row.
  for (const read of info.reads) {
    const x = tokenX(read.row, false);
    if (x === null) continue;
    const y = rowTop(read.row);
    paths += `<path d="M${railX},${y} H${x}" ${stroke}/>` +
             `<path d="M${x - 3},${y - 1} L${x + 3},${y - 1} L${x},${y + 3} Z" fill="${color}"/>`;
    reach(y);
  }

  if (info.reads.some((read) => read.from < 0) || (!info.defs.length && info.reads.length)) {
    paths += label(firstRow, "from before the region");
    reach(rowTop(firstRow) + 1);
  }
  if (REGION.live_out.includes(reg)) {
    paths += label(REGION.rows.length, "read after the region");
    reach(rowTop(REGION.rows.length) + 1);
  }

  if (bottom > top) paths += `<path d="M${railX},${top} V${bottom}" ${stroke}/>`;
  svg.innerHTML = paths;
}

// --- Tier view ---------------------------------------------------------

function renderTiers() {
  const pane = document.getElementById("tiers");
  const view = tiersView();
  const region = view.region;
  const ops = region.ops;
  const order = ops.map((_, i) => i).sort((a, b) => ops[a].row - ops[b].row);

  // This schedule's tiers. The last one holds no op when it starts at the
  // region end; it's drawn as the end instead.
  const tiers = region.tiers.map((tier) => ({ ...tier, ops: [] }));
  for (const i of order) tiers[ops[i].tier].ops.push(i);
  let endTier = null;
  const last = tiers[tiers.length - 1];
  if (tiers.length > 1 && last.ops.length === 0 && last.wait >= 0 &&
      isSinkWait(region, region.waits[last.wait])) {
    endTier = tiers.pop();
  }

  // The ideal's tiers.
  const idealCount = ops.length ? Math.max(...ops.map((op) => op.ideal_tier)) + 1 : 0;
  const ideal = Array.from({ length: idealCount }, () => []);
  for (const i of order) ideal[ops[i].ideal_tier].push(i);

  const late = order.filter((i) => isMemOp(ops[i]) && ops[i].tier > ops[i].ideal_tier);

  let h = `<div class="tierswitch">Show the tiers of ` +
          `<button data-side="code" class="${TIERS_SIDE === "code" ? "on" : ""}">Original</button>` +
          `<button data-side="edited" class="${TIERS_SIDE === "edited" ? "on" : ""}">Edited</button></div>`;
  if (view.stale) {
    h += `<div class="stalenote">Rows in this region have moved since the order these tiers describe. ` +
         `Export the order, compile with it, and load the replay to see the new order's.</div>`;
  }
  h += `<div class="tierbody"><div class="tierintro">A tier is a group of memory ops that no wait separates: they can go in ` +
       `any order within it, but not into an earlier tier. <b>This schedule</b>: each wait that stalls ` +
       `starts a tier (the clock only moves there). <b>Ideal</b>: each round of waiting for data starts ` +
       `a tier. <b>↓k</b>: k tiers later than in the ideal. <span class="chip" style="background:#888;` +
       `box-shadow:0 0 0 2px var(--stuck)">red ring</span>: a load issued late (the +N in the code view). ` +
       `Hover a chip for what it waits on (solid) and what waits on it (dashed); click to find it in the code.</div>`;
  h += `<div class="tiersummary">this schedule: <b>${tiers.length}</b> tiers, memory time ` +
       `<b>${region.scheduled_memory_time}</b> · ideal: <b>${idealCount}</b> tiers, memory time ` +
       `<b>${region.ideal_memory_time}</b> · <b>${late.length}</b> ops in a later tier than ideal</div>`;

  // This schedule.
  let actual = `<div class="colhead">This schedule</div>`;
  tiers.forEach((tier, k) => {
    if (k > 0) {
      const wait = region.waits[tier.wait];
      const w = waitNote(region, wait);
      const where = isSinkWait(region, wait) ? "region end" : rowName(view, wait.row);
      actual += `<div class="boundary stall" title="${esc(where + ": " + w.note)}">` +
                `${esc(where)} · ${esc(w.note)}</div>`;
    }
    const chips = tier.ops.map((i) => {
      const op = ops[i];
      const behind = op.tier - op.ideal_tier;
      return chip(op, i, op.stuck > 0 ? " stuck" : "",
                  behind > 0 ? `<span class="late">↓${behind}</span>` : "");
    }).join("");
    const count = tier.ops.filter((i) => isMemOp(ops[i])).length;
    actual += `<div class="tier${tier.ops.length ? "" : " empty"}"><div class="tierlabel">` +
              `<b>Tier ${k}</b> · clock ${tier.clock} · ${count ? count + " ops" : "no memory ops"}</div>` +
              `<div class="chips">${chips}</div></div>`;
  });
  if (endTier) {
    const wait = region.waits[endTier.wait];
    actual += `<div class="boundary stall">region end · ${esc(waitNote(region, wait).note)}</div>`;
  }
  actual += `<div class="endmark">region end · memory time ${region.scheduled_memory_time}</div>`;

  // The ideal.
  let idealHtml = `<div class="colhead">Ideal</div>`;
  ideal.forEach((tierOps, k) => {
    if (k > 0) {
      idealHtml += `<div class="boundary">waits for data from an earlier tier</div>`;
    }
    const starts = tierOps.map((i) => ops[i].ideal_start);
    const lo = Math.min(...starts), hi = Math.max(...starts);
    const count = tierOps.filter((i) => isMemOp(ops[i])).length;
    idealHtml += `<div class="tier"><div class="tierlabel"><b>Tier ${k}</b> · ` +
                 `earliest start ${lo === hi ? lo : lo + "–" + hi} · ${count} ops</div>` +
                 `<div class="chips">${tierOps.map((i) => chip(ops[i], i)).join("")}</div></div>`;
  });
  idealHtml += `<div class="endmark">region end · memory time ${region.ideal_memory_time}</div>`;

  h += `<div class="tiercols"><div class="tiercol" id="tc-actual">${actual}<svg class="links"></svg></div>` +
       `<div class="tiercol" id="tc-ideal">${idealHtml}<svg class="links"></svg></div></div></div>`;
  if (!ops.length) h = h.slice(0, h.indexOf("</div>") + 6) + `<div class="hint">No memory ops in this region.</div>`;
  pane.classList.toggle("stale", view.stale);
  pane.innerHTML = h;
}

// Lines in each tier column from the op's inputs to it (solid) and from it
// to the ops that wait on it (dashed).
function drawLinks(index) {
  const view = tiersView();
  for (const id of ["tc-actual", "tc-ideal"]) {
    const column = document.getElementById(id);
    if (!column) continue;
    const svg = column.querySelector("svg.links");
    const base = column.getBoundingClientRect();
    const at = (i) => column.querySelector(`.chip[data-op="${i}"]`);
    const link = (from, to, dashed) => {
      const a = at(from), b = at(to);
      if (!a || !b) return "";
      const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
      const x1 = ra.left + ra.width / 2 - base.left, y1 = ra.bottom - base.top;
      const x2 = rb.left + rb.width / 2 - base.left, y2 = rb.top - base.top;
      const bend = Math.max((y2 - y1) / 2, 12);
      return `<path d="M${x1},${y1} C${x1},${y1 + bend} ${x2},${y2 - bend} ${x2},${y2}" fill="none" ` +
             `stroke="${dashed ? "#8a8884" : "#0b0b0b"}" stroke-width="1.3"` +
             `${dashed ? ' stroke-dasharray="4,3"' : ""}/>`;
    };
    let paths = "";
    for (const j of view.region.ops[index].inputs) paths += link(j, index, false);
    for (const j of view.consumers[index]) paths += link(index, j, true);
    svg.innerHTML = paths;
  }
}

// --- Reordering ----------------------------------------------------------

// Per region index, the order its rows are shown in the Edited pane. order
// holds the rows' dumped numbers in shown order; moved, the rows moved by
// hand. undo and redo hold {order, moved} states.
const EDITS = new Map();
let SUCCESSORS = [];   // per row of the shown region: the rows that must come after it
let SELECTION = null;  // {anchor, start, end}: positions in the edited order
let WINDOW = null;     // the selection's legal window (legalWindow)

function editOf(region) {
  if (!EDITS.has(region.index)) {
    EDITS.set(region.index, { order: region.rows.map((_, i) => i), moved: new Set(),
                              undo: [], redo: [] });
  }
  return EDITS.get(region.index);
}

function isEdited(region) {
  return EDITS.has(region.index) &&
         editOf(region).order.some((row, position) => row !== position);
}

// A dump written before the dumper listed predecessors can't be reordered.
const canReorder = (region) => region.rows.every((row) => Array.isArray(row.predecessors));

// A row's position in the edited order; the region start is before every
// row, and the region end after.
function positionOfRow(row) {
  if (row < 0 || row === REGION.rows.length) return row;
  return editOf(REGION).order.indexOf(row);
}

// Why row `later` must stay below row `earlier`, for an edge of `kind`.
// A register edge names the virtual registers; one through a physical
// register (exec, vcc, scc, ...) can't be named from the dump.
function edgeReason(earlier, later, kind) {
  const rows = REGION.rows;
  const shared = (a, b) => a.filter((reg) => b.includes(reg)).map((reg) => "%" + reg).join(", ");
  if (kind === "data") {
    const regs = shared(rows[earlier].defs, rows[later].uses);
    return `row ${later} reads ${regs || "a physical register"} that row ${earlier} writes`;
  }
  if (kind === "output") {
    const regs = shared(rows[earlier].defs, rows[later].defs);
    return `rows ${earlier} and ${later} both write ${regs || "a physical register"}`;
  }
  if (kind === "anti") {
    const regs = shared(rows[earlier].uses, rows[later].defs);
    return `row ${later} writes ${regs || "a physical register"} that row ${earlier} reads`;
  }
  const what = { "barrier": "a scheduling barrier", "may-alias": "memory that may alias",
                 "must-alias": "memory that aliases", "artificial": "an artificial edge" }[kind] || kind;
  return `row ${later} must stay below row ${earlier}: ${what}`;
}

// The selection's legal window, as positions in the edited order. top is
// the last row outside the selection that the selection depends on (-1 for
// none), bottom the first row outside it that depends on the selection (the
// row count, for the region end, if none). The rows between them depend on
// neither, so the selection can move as a block into any gap from just
// below top to just above bottom: gaps top + 1 through bottom, where gap g
// is just above position g. Each bound comes with its reasons.
function legalWindow(region, start, end) {
  const order = editOf(region).order;
  const position = new Array(order.length);
  order.forEach((row, p) => { position[row] = p; });
  const inSelection = (row) => position[row] >= start && position[row] <= end;

  const bounds = { top: -1, bottom: order.length, topReasons: [], bottomReasons: [] };
  for (let p = start; p <= end; p++) {
    const row = order[p];
    for (const predecessor of region.rows[row].predecessors) {
      if (inSelection(predecessor.row)) continue;
      const at = position[predecessor.row];
      const reason = edgeReason(predecessor.row, row, predecessor.kind);
      if (at > bounds.top) {
        bounds.top = at;
        bounds.topReasons = [reason];
      } else if (at === bounds.top) {
        bounds.topReasons.push(reason);
      }
    }
    for (const successor of SUCCESSORS[row]) {
      if (inSelection(successor.row)) continue;
      const at = position[successor.row];
      const reason = edgeReason(row, successor.row, successor.kind);
      if (at < bounds.bottom) {
        bounds.bottom = at;
        bounds.bottomReasons = [reason];
      } else if (at === bounds.bottom) {
        bounds.bottomReasons.push(reason);
      }
    }
  }
  return bounds;
}

// Shades the selection and its window in the Edited pane, marks the two
// rows that bound it with their reasons, and marks the rows an alt-click
// can drop it below: the top bound (or the region start) and the rows
// between the bounds outside the selection.
function paintSelection() {
  const pane = document.getElementById("edited");
  const wrap = pane.querySelector(".codewrap");
  if (!wrap) return;
  for (const el of wrap.querySelectorAll(".row.sel, .row.window, .row.bound, .row.target")) {
    el.classList.remove("sel", "window", "bound", "target");
    el.removeAttribute("title");
  }
  wrap.classList.toggle("selecting", SELECTION !== null);
  WINDOW = null;
  if (SELECTION) {
    const order = editOf(REGION).order;
    const { start, end } = SELECTION;
    const rowAt = (p) => rowIn(pane, p < 0 || p === order.length ? p : order[p]);
    WINDOW = legalWindow(REGION, start, end);
    for (let p = WINDOW.top; p < WINDOW.bottom; p++) {
      const el = rowAt(p);
      if (p >= start && p <= end) {
        el.classList.add("sel");
        continue;
      }
      el.classList.add("target");
      if (p > WINDOW.top) el.classList.add("window");
    }
    if (WINDOW.top >= 0) {
      const el = rowAt(WINDOW.top);
      el.classList.add("bound");
      el.title = "The selection can't move above this row:\n" + WINDOW.topReasons.join("\n");
    }
    if (WINDOW.bottom < order.length) {
      const el = rowAt(WINDOW.bottom);
      el.classList.add("bound");
      el.title = "The selection can't move below this row:\n" + WINDOW.bottomReasons.join("\n");
    }
  }
  renderEditBar();
}

// The line under the region's stats: what's selected and where it can go,
// and undo / redo / reset.
function renderEditBar() {
  const bar = document.getElementById("editbar");
  if (!bar || !REGION) return;
  if (!canReorder(REGION)) {
    bar.innerHTML = "This dump has no dependence lists, so its rows can't be moved. " +
                    "Recompile to get a new one.";
    return;
  }
  const edit = editOf(REGION);
  const order = edit.order;
  let h = `<button data-action="undo"${edit.undo.length ? "" : " disabled"}>Undo</button>` +
          `<button data-action="redo"${edit.redo.length ? "" : " disabled"}>Redo</button>` +
          `<button data-action="reset"${edit.undo.length || isEdited(REGION) ? "" : " disabled"}>` +
          `Reset region</button>`;
  if (SELECTION && WINDOW) {
    const { start, end } = SELECTION;
    const count = end - start + 1;
    const rows = count === 1 ? `row ${order[start]}` : `rows ${order[start]}–${order[end]} (${count})`;
    const above = WINDOW.top >= 0 ? "row " + order[WINDOW.top] : "the region start";
    const below = WINDOW.bottom < order.length ? "row " + order[WINDOW.bottom] : "the region end";
    h += `<span>Selected <b>${rows}</b>: can move anywhere between ${above} and ${below}. ` +
         `Drag it by its row numbers, or alt-click a shaded row to move it just below that row. ` +
         `Esc to deselect.</span>`;
  } else {
    h += `<span>In the Edited pane, click a row number to select it; shift-click to extend.</span>`;
  }
  bar.innerHTML = h;
}

// Moves the selection into gap `gap`: just above the row at that position,
// or to the region end for the row count. The caller checks that the gap is
// in the window.
function moveSelection(gap) {
  const edit = editOf(REGION);
  const { start, end } = SELECTION;
  if (gap >= start && gap <= end + 1) return;  // it's already there
  const block = edit.order.slice(start, end + 1);
  const rest = edit.order.slice(0, start).concat(edit.order.slice(end + 1));
  const at = gap === edit.order.length ? rest.length : rest.indexOf(edit.order[gap]);
  edit.undo.push({ order: edit.order, moved: edit.moved });
  edit.redo = [];
  edit.order = rest.slice(0, at).concat(block, rest.slice(at));
  edit.moved = new Set([...edit.moved, ...block]);
  SELECTION = { anchor: at, start: at, end: at + block.length - 1 };
  rerender();
}

// Undo, redo and reset. Each clears the selection, whose rows may be
// anywhere afterwards.
function editAction(action) {
  const edit = editOf(REGION);
  const current = { order: edit.order, moved: edit.moved };
  let next = null;
  if (action === "undo" && edit.undo.length) {
    edit.redo.push(current);
    next = edit.undo.pop();
  } else if (action === "redo" && edit.redo.length) {
    edit.undo.push(current);
    next = edit.redo.pop();
  } else if (action === "reset" && (edit.undo.length || isEdited(REGION))) {
    edit.undo.push(current);
    edit.redo = [];
    next = { order: REGION.rows.map((_, i) => i), moved: new Set() };
  }
  if (!next) return;
  edit.order = next.order;
  edit.moved = next.moved;
  SELECTION = null;
  rerender();
}

// The function's order file (OrderReplay.h): every region, in block order,
// with its rows' texts in edited order. A region never edited is as dumped.
function buildOrderFile() {
  const regions = [];
  for (const block of DATA.blocks) {
    for (const region of block.regions) {
      const order = EDITS.has(region.index) ? editOf(region).order : region.rows.map((_, i) => i);
      regions.push({ index: region.index, block: block.number,
                     instrs: order.map((row) => region.rows[row].text) });
    }
  }
  return { function: DATA.function, regions };
}

document.getElementById("export").addEventListener("click", () => {
  if (!DATA) return;
  const blob = new Blob([JSON.stringify(buildOrderFile(), null, 1)], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = DATA.function + ".order.json";
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
});

document.getElementById("regionbar").addEventListener("click", (event) => {
  const button = event.target.closest("button[data-action]");
  if (button && REGION) editAction(button.dataset.action);
});

document.getElementById("tiers").addEventListener("click", (event) => {
  const button = event.target.closest("button[data-side]");
  if (!button || !REGION) return;
  TIERS_SIDE = button.dataset.side;
  renderTiers();
});

// --- Replays -------------------------------------------------------------

// Per region index, the replays loaded for it: byOrder maps an edited order
// (dump row numbers, joined by commas) to its replay, and latest is the last
// one loaded. A replay holds the replayed region, the function-wide data it
// came with, each replay row's number in the dump (labels), and the inverse
// (rowOfLabel).
const REPLAYS = new Map();

// Loads a memory_viz dump compiled from an exported order. Each of its
// regions must have the dump's instructions, matched by text: a replay row
// takes the first dump row with its text not taken yet, as the compiler's
// replay pairs them. Then every region shows the replay's order, an undoable
// step for each region the edited order differs in.
function loadReplay(replay, name) {
  const problems = [];
  if (replay.function !== DATA.function) {
    problems.push(`it's for ${replay.function}, not ${DATA.function}`);
  }

  const loaded = [];
  const seen = new Set();
  for (const block of replay.blocks || []) {
    for (const region of block.regions) {
      const dumped = DATA.blocks.flatMap((b) => b.regions.map((r) => ({ block: b, region: r })))
                                .find((entry) => entry.region.index === region.index);
      if (!dumped) {
        problems.push(`it has region ${region.index}, which the dump doesn't`);
        continue;
      }
      seen.add(region.index);
      if (dumped.block.number !== block.number) {
        problems.push(`its region ${region.index} is in block ${block.number}, not ${dumped.block.number}`);
        continue;
      }
      const byText = new Map();
      dumped.region.rows.forEach((row, i) => {
        if (!byText.has(row.text)) byText.set(row.text, []);
        byText.get(row.text).push(i);
      });
      const labels = [];
      for (const row of region.rows) {
        const candidates = byText.get(row.text);
        if (!candidates || !candidates.length) break;
        labels.push(candidates.shift());
      }
      if (labels.length !== region.rows.length || labels.length !== dumped.region.rows.length) {
        problems.push(`its region ${region.index} doesn't have the dump's instructions`);
        continue;
      }
      const rowOfLabel = new Array(labels.length);
      labels.forEach((label, i) => { rowOfLabel[label] = i; });
      loaded.push({ index: region.index, dumped: dumped.region,
                    replay: { region, data: replay, labels, rowOfLabel } });
    }
  }
  for (const block of DATA.blocks) {
    for (const region of block.regions) {
      if (!seen.has(region.index)) problems.push(`it has no region ${region.index}`);
    }
  }
  if (problems.length) {
    setStatus(`Didn't load ${name}: ${problems.slice(0, 3).join("; ")}` +
              (problems.length > 3 ? ` (and ${problems.length - 3} more)` : ""), true);
    return;
  }

  const jumped = [];
  for (const entry of loaded) {
    if (!REPLAYS.has(entry.index)) REPLAYS.set(entry.index, { byOrder: new Map(), latest: null });
    const replays = REPLAYS.get(entry.index);
    const key = entry.replay.labels.join(",");
    replays.byOrder.set(key, entry.replay);
    replays.latest = entry.replay;

    // Show the replay's order, if it isn't the one shown. Its moved rows are
    // the ones they were when this order was last shown, if it was.
    const edit = editOf(entry.dumped);
    if (edit.order.join(",") === key) continue;
    const earlier = [...edit.undo, ...edit.redo].find((state) => state.order.join(",") === key);
    edit.undo.push({ order: edit.order, moved: edit.moved });
    edit.redo = [];
    edit.order = entry.replay.labels.slice();
    edit.moved = earlier ? earlier.moved : new Set();
    jumped.push(entry.index);
  }
  SELECTION = null;
  setStatus(`Loaded replay ${name}` + (jumped.length ? `; now showing its order in region ` +
            jumped.join(", ") + " (undo to go back)" : "") + ".");
  for (const block of DATA.blocks) {
    for (const region of block.regions) {
      cy.getElementById("r" + region.index).toggleClass("edited", isEdited(region));
    }
  }
  rerender();
}

// --- Dragging rows -----------------------------------------------------

// A drag starts by pressing a row number in the Edited pane and moving
// more than a few pixels. It drags the selection if the row is in it, else
// just that row. A line shows the gap the rows would go to, held inside the
// window; at a bound it turns red and says why, and dropping there puts
// the rows at the bound. The pane scrolls when the
// cursor nears its top or bottom edge. Esc cancels.
let DRAG = null;  // {row, startY, started, cancelled, gap, blocked, x, y, line, frame}
let suppressClick = false;

document.getElementById("edited").addEventListener("mousedown", (event) => {
  if (!REGION || event.button !== 0 || event.shiftKey || event.altKey || !canReorder(REGION)) return;
  const numElement = event.target.closest(".num");
  const rowElement = event.target.closest(".row[data-row]");
  if (!numElement || !rowElement) return;
  const row = +rowElement.dataset.row;
  if (row < 0 || row >= REGION.rows.length) return;
  event.preventDefault();
  DRAG = { row, startY: event.clientY, started: false, gap: null, x: event.clientX, y: event.clientY };
});

document.addEventListener("mousemove", (event) => {
  if (!DRAG || DRAG.cancelled) return;
  DRAG.x = event.clientX;
  DRAG.y = event.clientY;
  if (!DRAG.started) {
    if (Math.abs(event.clientY - DRAG.startY) < 5) return;
    startRowDrag();
  }
  updateDrop();
});

document.addEventListener("mouseup", () => {
  if (!DRAG) return;
  const drag = DRAG;
  endRowDrag();
  if (!drag.started) return;
  // The browser follows the mouseup with a click, which shouldn't select a
  // row. Released outside the pane, that click doesn't reach it, so stop
  // waiting for it once this event is done.
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 0);
  if (drag.gap !== null && !drag.cancelled) moveSelection(drag.gap);
});

function startRowDrag() {
  const position = positionOfRow(DRAG.row);
  if (!SELECTION || position < SELECTION.start || position > SELECTION.end) {
    SELECTION = { anchor: position, start: position, end: position };
    paintSelection();
  }
  DRAG.started = true;
  document.body.classList.add("rowdrag");
  const wrap = document.querySelector("#edited .codewrap");
  DRAG.line = document.createElement("div");
  DRAG.line.className = "dropline";
  DRAG.line.innerHTML = "<span></span>";
  wrap.appendChild(DRAG.line);
  // Scroll while the cursor is near the pane's top or bottom edge.
  const scroll = () => {
    if (!DRAG || !DRAG.started || DRAG.cancelled) return;
    const pane = document.getElementById("edited");
    const box = pane.getBoundingClientRect();
    const edge = 40;
    let step = 0;
    if (DRAG.y < box.top + edge + 40) step = -Math.ceil((box.top + edge + 40 - DRAG.y) / 4);
    else if (DRAG.y > box.bottom - edge) step = Math.ceil((DRAG.y - box.bottom + edge) / 4);
    if (step) {
      pane.scrollTop += step;
      updateDrop();
    }
    DRAG.frame = requestAnimationFrame(scroll);
  };
  DRAG.frame = requestAnimationFrame(scroll);
}

function endRowDrag() {
  if (DRAG && DRAG.line) DRAG.line.remove();
  if (DRAG && DRAG.frame) cancelAnimationFrame(DRAG.frame);
  document.body.classList.remove("rowdrag");
  DRAG = null;
}

// Puts the line at the gap under the cursor, held inside the window.
function updateDrop() {
  const pane = document.getElementById("edited");
  const box = pane.getBoundingClientRect();
  const order = editOf(REGION).order;
  const headBottom = pane.querySelector(".row.head").getBoundingClientRect().bottom;
  const y = Math.min(Math.max(DRAG.y, headBottom + 1), box.bottom - 1);
  const under = document.elementFromPoint(box.left + 10, y);
  const rowElement = under && under.closest("#edited .row[data-row]");
  if (!rowElement) return;
  const row = +rowElement.dataset.row;
  const position = positionOfRow(row);
  const rect = rowElement.getBoundingClientRect();
  let gap;
  if (position < 0) gap = 0;
  else if (position === order.length) gap = order.length;
  else gap = y < rect.top + rect.height / 2 ? position : position + 1;

  const lowest = WINDOW.top + 1, highest = WINDOW.bottom;
  const held = Math.min(Math.max(gap, lowest), highest);
  DRAG.gap = held;
  DRAG.blocked = held !== gap;

  // The line goes along the top of the row at the gap (or of the region end).
  const target = rowIn(pane, held === order.length ? held : order[held]);
  DRAG.line.style.top = target.offsetTop - 1 + "px";
  DRAG.line.classList.toggle("blocked", DRAG.blocked);
  const label = DRAG.line.querySelector("span");
  label.style.left = pane.scrollLeft + 40 + "px";
  if (DRAG.blocked) {
    label.textContent = gap < lowest ? "as high as it can go: " + WINDOW.topReasons[0]
                                     : "as low as it can go: " + WINDOW.bottomReasons[0];
  } else if (held >= SELECTION.start && held <= SELECTION.end + 1) {
    label.textContent = "where it is now";
  } else {
    label.textContent = "move here";
  }
}

// --- Hover and click -----------------------------------------------------

let marked = [];
function mark(elements, cls) {
  for (const el of elements) { if (el) { el.classList.add(cls); marked.push([el, cls]); } }
}
function clearMarks() {
  for (const [el, cls] of marked) el.classList.remove(cls);
  marked = [];
  for (const svg of document.querySelectorAll("svg.links")) svg.innerHTML = "";
}

// An op's chips in a view: in its code pane, and in the tier view if that
// shows the same view.
function chipsIn(view, i) {
  const chips = [...view.pane.querySelectorAll(`.chip[data-op="${i}"]`)];
  if (tiersView() === view) chips.push(...document.querySelectorAll(`#tiers .chip[data-op="${i}"]`));
  return chips;
}

document.addEventListener("mouseover", (event) => {
  if (!REGION || DRAG) return;
  clearMarks();
  const target = event.target;

  // A virtual register: its mentions and def-to-read lines. The pinned one
  // shows whenever the cursor is on no other.
  const regElement = target.closest("#code .vr, #edited .vr");
  showRegister(regElement ? +regElement.dataset.reg : pinnedReg);
  if (regElement) {
    if (!regElement.title) regElement.title = regTitle(+regElement.dataset.reg);
    return;
  }

  const host = target.closest("#code, #edited, #tiers");
  if (!host) return;
  const view = host.id === "tiers" ? tiersView() : VIEWS[host.id];

  // The same instruction in the other code pane.
  const rowElement = target.closest(".row[data-row]");
  if (rowElement && host.id !== "tiers") {
    const row = +rowElement.dataset.row;
    if (row >= 0 && row < REGION.rows.length) {
      const other = host.id === "code" ? VIEWS.edited : VIEWS.code;
      mark([rowIn(other.pane, row)], "twin");
    }
  }

  // A memory op: it, its inputs, and what waits on it.
  const opElement = target.closest(".chip[data-op], rect[data-op]");
  if (opElement) {
    const i = +opElement.dataset.op;
    const op = view.region.ops[i];
    mark(chipsIn(view, i), "hl");
    for (const j of op.inputs) mark(chipsIn(view, j), "in");
    for (const j of view.consumers[i]) mark(chipsIn(view, j), "out");
    mark([rowIn(view.pane, view.labels[op.row])], "hl");
    if (tiersView() === view) drawLinks(i);
    if (!opElement.title && opElement.tagName !== "rect") opElement.title = opTitle(view, op);
    return;
  }

  // A late load's badge: the waits that delayed it.
  const badge = target.closest("[data-stuck]");
  if (badge) {
    const op = view.region.ops[+badge.dataset.stuck];
    for (const sw of op.stuck_waits) {
      const waitRow = view.region.waits[sw.wait].row;
      mark([rowIn(view.pane, waitRow === view.region.rows.length ? waitRow : view.labels[waitRow])], "blame");
    }
    return;
  }

  // A wait: the loads it delayed.
  const waitNoteElement = target.closest("[data-wait]");
  if (waitNoteElement) {
    view.region.ops.forEach((op, i) => {
      if (op.stuck_waits.some((sw) => sw.wait === +waitNoteElement.dataset.wait)) {
        mark([rowIn(view.pane, view.labels[op.row])], "blame");
        mark(chipsIn(view, i), "hl");
      }
    });
  }
});

// Clicking a chip in the tier view scrolls its code pane to its row.
document.getElementById("tiers").addEventListener("click", (event) => {
  const chipElement = event.target.closest(".chip[data-op]");
  if (!chipElement || !REGION) return;
  const view = tiersView();
  const row = rowIn(view.pane, view.labels[view.region.ops[+chipElement.dataset.op].row]);
  if (!row || view.pane.classList.contains("hidden")) return;
  view.pane.scrollTop = row.offsetTop - view.pane.clientHeight / 3;
  row.classList.remove("flash");
  void row.offsetWidth;
  row.classList.add("flash");
});

// A shift-click on a row number extends the row selection, not the page's
// text selection.
document.getElementById("edited").addEventListener("mousedown", (event) => {
  if (event.shiftKey && event.target.closest(".num")) event.preventDefault();
});

// In the code panes:
//   - Edited pane, alt-click a shaded row (or the region start, or the top
//     bound): move the selection just below it.
//   - Edited pane, click a row number: select that row. Shift-click: extend
//     the selection from the row first clicked.
//   - Click a register: keep it shown while you scroll to far-off reads;
//     click it again or Esc to let go.
for (const id of ["code", "edited"]) {
  document.getElementById(id).addEventListener("click", (event) => {
    if (!REGION) return;
    if (suppressClick) {
      suppressClick = false;
      return;
    }
    const rowElement = event.target.closest(".row[data-row]");

    if (id === "edited" && event.altKey) {
      event.preventDefault();
      if (rowElement && SELECTION && WINDOW) {
        const position = positionOfRow(+rowElement.dataset.row);
        const inSelection = position >= SELECTION.start && position <= SELECTION.end;
        if (position >= WINDOW.top && position < WINDOW.bottom && !inSelection) {
          moveSelection(position + 1);
        }
      }
      return;
    }

    const numElement = event.target.closest(".num");
    if (id === "edited" && numElement && rowElement && canReorder(REGION)) {
      const row = +rowElement.dataset.row;
      if (row < 0 || row >= REGION.rows.length) return;
      const position = positionOfRow(row);
      const anchor = event.shiftKey && SELECTION ? SELECTION.anchor : position;
      SELECTION = { anchor, start: Math.min(anchor, position), end: Math.max(anchor, position) };
      paintSelection();
      return;
    }

    const regElement = event.target.closest(".vr");
    if (!regElement) return;
    const reg = +regElement.dataset.reg;
    pinnedReg = pinnedReg === reg ? null : reg;
  });
}

// Esc cancels a drag, then drops the selection, then the pinned register.
// Ctrl+Z and Ctrl+Y (or Ctrl+Shift+Z) undo and redo moves in the shown
// region.
document.addEventListener("keydown", (event) => {
  if (!REGION) return;
  if (event.key === "Escape") {
    if (DRAG && DRAG.started && !DRAG.cancelled) {
      // The mouseup still ends the drag, without a move.
      DRAG.cancelled = true;
      if (DRAG.line) DRAG.line.remove();
      document.body.classList.remove("rowdrag");
    } else if (SELECTION) {
      SELECTION = null;
      paintSelection();
    } else if (pinnedReg !== null) {
      pinnedReg = null;
      showRegister(null);
    }
    return;
  }
  if (!(event.ctrlKey || event.metaKey) || event.target.tagName === "INPUT") return;
  const key = event.key.toLowerCase();
  if (key === "z" && !event.shiftKey) {
    event.preventDefault();
    editAction("undo");
  } else if (key === "y" || (key === "z" && event.shiftKey)) {
    event.preventDefault();
    editAction("redo");
  }
});

// The register rail follows the pinned columns when a pane scrolls sideways.
for (const id of ["code", "edited"]) {
  let scrollLeft = 0;
  document.getElementById(id).addEventListener("scroll", (event) => {
    if (event.target.scrollLeft === scrollLeft) return;
    scrollLeft = event.target.scrollLeft;
    if (shownReg !== null && VIEWS[id]) drawRegister(VIEWS[id]);
  });
}
</script>
</body>
</html>
